<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 96" width="260" height="96">
  <defs>
    <linearGradient id="nnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#666"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>
  <!-- NN monogram: two folded planes evoking the wordmark -->
