    <polygon points="88,10 108,10 142,72 142,10 160,10 160,86 140,86 106,24 106,86 88,86"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" fill="#1a1a1a">
    <text x="178" y="42" font-size="20" font-weight="800" letter-spacing="-0.5">NICOLAS</text>
    <text x="178" y="66" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#111">NICOLAS</text>
    <text x="178" y="86" font-size="10" font-weight="600" letter-spacing="6" fill="#6b6b6b">G R O U P</text>
