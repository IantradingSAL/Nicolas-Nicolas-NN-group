<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="Nicolas Nicolas Group">
  <defs>
    <linearGradient id="nnA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2b2b2b"/>
      <stop offset="60%" stop-color="#555"/>
      <stop offset="100%" stop-color="#8f8f8f"/>
    </linearGradient>
    <linearGradient id="nnB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#4a4a4a"/>
      <stop offset="60%" stop-color="#7a7a7a"/>
      <stop offset="100%" stop-color="#b5b5b5"/>
    </linearGradient>
  </defs>
  <!-- Stylized NN monogram: two overlapping folded N-forms -->
  <g>
    <path d="M 10,14 L 32,14 L 74,90 L 74,14 L 96,14 L 96,106 L 74,106 L 32,30 L 32,106 L 10,106 Z" fill="url(#nnA)"/>
    <path d="M 100,14 L 122,14 L 164,90 L 164,14 L 186,14 L 186,106 L 164,106 L 122,30 L 122,106 L 100,106 Z" fill="url(#nnB)"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'DM Sans','Helvetica Neue',Arial,sans-serif">
    <text x="204" y="46" font-size="22" font-weight="700" letter-spacing="0.5" fill="#4b4b4b">NICOLAS</text>
    <text x="204" y="76" font-size="22" font-weight="900" letter-spacing="0.5" fill="#111">NICOLAS</text>
    <text x="204" y="100" font-size="11" font-weight="700" letter-spacing="8" fill="#6b6b6b">G R O U P</text>
  </g>
</svg>
